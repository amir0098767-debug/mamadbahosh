<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ممد باهوش</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 500px at 80% -10%,#1c2a63,transparent 60%),radial-gradient(700px 400px at 0 110%,#2a1760,transparent 55%),#070b16;color:#eef1ff;font-family:Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:420px;margin:auto;padding:30px 20px;text-align:center;width:100%}
.logo{width:96px;height:96px;border-radius:26px;margin:0 auto 16px;background:linear-gradient(135deg,#38e1ff,#9b6bff);display:grid;place-items:center;font-size:48px;animation:fl 3s ease-in-out infinite;box-shadow:0 20px 60px rgba(56,225,255,.3)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-size:24px;margin:10px 0;background:linear-gradient(135deg,#38e1ff,#9b6bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
p{color:#8893bd;font-size:14px;margin:10px 0;line-height:1.7}
input,textarea,button{font:inherit;border-radius:14px;border:1px solid rgba(255,255,255,.1);padding:13px;background:rgba(0,0,0,.32);color:#eef1ff;width:100%;outline:none;margin-top:8px}
input:focus,textarea:focus{border-color:#38e1ff;box-shadow:0 0 0 3px rgba(56,225,255,.12)}
button{background:linear-gradient(135deg,#38e1ff,#9b6bff);color:#06101f;border:0;font-weight:bold;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button.g{background:rgba(255,255,255,.07);color:#eef1ff;border:1px solid rgba(255,255,255,.1);font-weight:normal}
#code{text-align:center;letter-spacing:10px;font-size:26px;direction:ltr;font-family:monospace;font-weight:bold;padding:18px}
#v-main{display:none;flex:1;flex-direction:column;min-height:100vh}
#top{display:flex;gap:10px;align-items:center;padding:12px;background:rgba(8,11,28,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:5}
#top .av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#38e1ff,#9b6bff);display:grid;place-items:center;font-size:20px;flex-shrink:0}
#top b{flex:1;font-size:15px;text-align:right;line-height:1.3}
#top small{display:block;color:#8893bd;font-size:11px;font-weight:normal}
#top button{width:auto;padding:8px 14px;margin:0;font-size:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#eef1ff;font-weight:normal}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-left:5px;box-shadow:0 0 8px #34d399}
#log{flex:1;overflow-y:auto;padding:14px;scroll-behavior:smooth}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.m{padding:11px 15px;border-radius:18px;margin:8px 0;max-width:86%;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.65;animation:mi .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mi{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.m.u{background:linear-gradient(135deg,rgba(56,225,255,.15),rgba(155,107,255,.12));margin-left:auto;border-bottom-left-radius:6px}
.m.a{background:rgba(255,255,255,.07);margin-right:auto;border-bottom-right-radius:6px}
.m.sys{background:rgba(251,191,36,.12);font-size:12.5px;text-align:center;max-width:100%;margin:10px auto;color:#fbbf24;padding:8px 14px}
.m.err{background:rgba(251,113,133,.13);color:#fb7185;font-size:13px;max-width:100%;margin:8px auto;text-align:center;padding:8px 14px}
.typing{display:inline-flex!important;gap:4px;padding:14px 20px!important;background:rgba(255,255,255,.07)}
.typing span{width:8px;height:8px;background:linear-gradient(135deg,#38e1ff,#9b6bff);border-radius:50%;animation:tp 1.4s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0) scale(1);opacity:.4}30%{transform:translateY(-8px) scale(1.15);opacity:1}}
#bar{display:flex;gap:8px;padding:10px 12px;background:rgba(8,11,28,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);align-items:flex-end}
#bar textarea{margin:0;flex:1;min-height:46px;max-height:120px;resize:none;border-radius:22px;padding:13px 16px;line-height:1.4}
#bar button{width:46px;height:46px;padding:0;border-radius:50%;font-size:18px;margin:0;flex-shrink:0;display:grid;place-items:center}
#err{color:#fb7185;font-size:13px;min-height:20px;margin-top:8px}
#loading{color:#8893bd;font-size:13px;margin-top:14px}
</style></head><body>

<div id="v-login" class="wrap">
  <div class="logo">🤖</div>
  <h1>ممد باهوش</h1>
  <p>دستیار هوشمند، شوخ‌طبع و رفیق خودی</p>
  <div id="bots"></div>
  <div id="loginForm" style="display:none">
    <p>۱) توی ربات بنویس <b>/login</b><br>۲) کد ۸ رقمی رو وارد کن</p>
    <input id="code" inputmode="numeric" maxlength="9" placeholder="━━━━━━━━">
    <button onclick="doLogin()" style="width:100%">ورود به برنامه</button>
    <p id="err"></p>
  </div>
  <div id="noBots" style="display:none">
    <p>هنوز رباتی تنظیم نشده.<br>از پنل ادمین یه ربات اضافه کن.</p>
    <button class="g" onclick="location.reload()">تلاش دوباره</button>
  </div>
  <p id="loading">⏳ در حال اتصال...</p>
</div>

<div id="v-main">
  <div id="top">
    <div class="av">🤖</div>
    <b>ممد باهوش<small id="uname"><span class="dot"></span> آنلاین</small></b>
    <button onclick="out()">خروج</button>
  </div>
  <div id="log"></div>
  <div id="bar">
    <textarea id="msg" placeholder="پیامت رو بنویس..." rows="1"></textarea>
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
var API = "https://mamadb.6wgbnqimz19ybvzgfk4wy9l8quoe7y4s.workers.dev";
var TOKEN = localStorage.getItem('mtk') || '';

function $(id){ return document.getElementById(id); }

function show(id){
  $('v-login').style.display = (id === 'v-login') ? 'block' : 'none';
  $('v-main').style.display = (id === 'v-main') ? 'flex' : 'none';
}

function api(path, body){
  var h = { 'Content-Type': 'application/json', 'X-App-Version': '2.0.0' };
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return fetch(API + '/app' + path, {
    method: body ? 'POST' : 'GET',
    headers: h,
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    return r.json().then(function(j){ j._s = r.status; return j; });
  }).catch(function(e){
    return { ok: false, error: 'اتصال به سرور برقرار نشد' };
  });
}

function boot(){
  api('/version').then(function(v){
    $('loading').style.display = 'none';
    if (!v.ok) {
      $('loading').style.display = 'block';
      $('loading').textContent = '❌ ' + (v.error || 'خطا در اتصال');
      return;
    }
    if (TOKEN) {
      startApp(v);
    } else {
      showLogin(v);
    }
  });
}

function showLogin(v){
  show('v-login');
  var bots = v.bots || [];
  if (!bots.length) {
    $('noBots').style.display = 'block';
    return;
  }
  var html = '';
  bots.forEach(function(b){
    var n = b.platform === 'Bale' ? 'بله' : 'تلگرام';
    html += '<a href="' + b.link + '" target="_blank" style="display:block;margin:8px 0;padding:14px;background:rgba(255,255,255,.08);color:#eef1ff;border-radius:14px;text-decoration:none;font-weight:bold;border:1px solid rgba(255,255,255,.1)">ورود از ربات ' + n + '</a>';
  });
  $('bots').innerHTML = html;
  $('loginForm').style.display = 'block';
}

function doLogin(){
  $('err').textContent = '';
  var c = $('code').value.replace(/[^0-9]/g, '');
  if (c.length !== 8) { $('err').textContent = 'کد باید ۸ رقم باشه'; return; }
  api('/auth/verify', { code: c, device: 'pwa' }).then(function(r){
    if (r.ok && r.token) {
      TOKEN = r.token;
      localStorage.setItem('mtk', TOKEN);
      boot();
    } else {
      $('err').textContent = r.message || 'کد اشتباه یا منقضی';
    }
  });
}

function startApp(v){
  show('v-main');
  api('/me').then(function(r){
    if (r.ok && r.user) {
      $('uname').innerHTML = '<span class="dot"></span> ' + (r.user.name || 'کاربر');
    }
  });
  api('/history').then(function(h){
    $('log').innerHTML = '';
    if (h.items && h.items.length) {
      h.items.forEach(function(m){ add(m.role, m.content); });
    } else {
      add('assistant', 'سلام! من ممد باهوشم 🤖\nهر سؤالی داری بپرس، با شوخی جوابت رو می‌دم 😎');
    }
  });
}

function add(role, text){
  var d = document.createElement('div');
  d.className = 'm ' + (role === 'user' ? 'u' : (role === 'error' ? 'err' : 'a'));
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

function typing(){
  var d = document.createElement('div');
  d.className = 'm a typing';
  d.innerHTML = '<span></span><span></span><span></span>';
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

function send(){
  var t = $('msg').value.trim();
  if (!t) return;
  $('msg').value = '';
  $('msg').style.height = 'auto';
  add('user', t);
  var w = typing();
  api('/chat', { message: t }).then(function(r){
    w.remove();
    if (r.ok) add('assistant', r.reply);
    else add('error', r.message || 'خطا در دریافت پاسخ');
  });
}

function out(){
  if (!confirm('از حساب خارج شوی؟')) return;
  api('/logout', {}).catch(function(){});
  localStorage.removeItem('mtk');
  TOKEN = '';
  boot();
}

$('msg').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
$('msg').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

boot();
</script></body></html>
